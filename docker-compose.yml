services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Development}
      ConnectionStrings__Postgres: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${DB_NAME:-building_material};Username=${DB_USER:-app};Password=${DB_PASSWORD:-app}
      ConnectionStrings__Redis: redis:6379
      Elasticsearch__Url: http://elasticsearch:9200/
      Elasticsearch__Index: catalog
      Jwt__Key: ${JWT_KEY:-your_jwt_key}
      Recaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY:-your_recaptcha_secret_key}
      Slack__WebhookUrl: ${SLACK_WEBHOOK_URL:-your_slack_webhook_url}
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      mailer: { condition: service_started }
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-building_material}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d building_material"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5673:5672", "15673:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
  mailer:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
volumes:
  postgres-data:
  elasticsearch-data:
